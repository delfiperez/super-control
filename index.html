<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 Mi Súper Cute & Kawaii Control 🌸</title>
  <style>
    :root {
      --primary: #a855f7;
      --primary-dark: #9333ea;
      --bg: #f3e8ff;
      --card: rgba(255, 255, 255, 0.92);
      --text: #581c87;
      --text-muted: #7e22ce;
      --border: #f0abfc;
      --accent: #ec4899;
      --pink-soft: #fbcfe8;
    }

    * { 
      box-sizing: border-box; 
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', -apple-system, sans-serif; 
      margin: 0; 
      padding: 0; 
    }

    body { 
      background-color: var(--bg);
      background-image: radial-gradient(#e9d5ff 2px, transparent 2px), radial-gradient(#fbcfe8 2px, #f3e8ff 2px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      color: var(--text); 
      padding-bottom: 85px; 
      min-height: 100vh;
    }
    
    header { 
      background: linear-gradient(135deg, #c084fc, #f472b6); 
      color: white; 
      padding: 1.2rem; 
      text-align: center; 
      font-weight: bold; 
      font-size: 1.3rem; 
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.25);
      border-bottom: 3px solid #f472b6;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
    }
    
    .container { padding: 1rem; max-width: 600px; margin: 0 auto; }
    .section { display: none; }
    .section.active { display: block; animation: fadeIn 0.3s ease-in-out; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .card { 
      background: var(--card); 
      border-radius: 20px; 
      padding: 1.2rem; 
      margin-bottom: 1.2rem; 
      border: 2px solid var(--border); 
      box-shadow: 0 8px 20px rgba(192, 132, 252, 0.15); 
      backdrop-filter: blur(5px);
    }

    h2 { 
      font-size: 1.15rem; 
      margin-bottom: 0.85rem; 
      color: var(--primary-dark); 
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    
    label { font-size: 0.85rem; font-weight: bold; display: block; margin-top: 0.6rem; color: var(--text-muted); }
    
    input, select, button { 
      width: 100%; 
      padding: 0.75rem; 
      margin-top: 0.3rem; 
      border: 2px solid #f5d0fe; 
      border-radius: 14px; 
      font-size: 0.95rem; 
      outline: none;
      transition: all 0.2s ease;
      background: #faf5ff;
      color: var(--text);
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 8px rgba(168, 85, 247, 0.3);
      background: #ffffff;
    }

    button { 
      background: linear-gradient(135deg, #a855f7, #ec4899); 
      color: white; 
      border: none; 
      font-weight: bold; 
      cursor: pointer; 
      margin-top: 1.1rem; 
      box-shadow: 0 4px 10px rgba(236, 72, 153, 0.3);
      border-radius: 16px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(236, 72, 153, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button.btn-danger { 
      background: linear-gradient(135deg, #f43f5e, #fb7185); 
      box-shadow: 0 4px 10px rgba(244, 63, 94, 0.3);
    }

    button.btn-secondary { 
      background: linear-gradient(135deg, #c084fc, #a855f7); 
      box-shadow: 0 4px 10px rgba(192, 132, 252, 0.3);
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 0.5rem; }

    .nav-bar { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      right: 0; 
      background: rgba(255, 255, 255, 0.95); 
      border-top: 2px solid var(--border); 
      display: flex; 
      justify-content: space-around; 
      padding: 0.6rem 0; 
      backdrop-filter: blur(10px);
      box-shadow: 0 -4px 15px rgba(168, 85, 247, 0.15);
      border-radius: 20px 20px 0 0;
    }

    .nav-btn { 
      background: none; 
      border: none; 
      color: #a855f7; 
      font-size: 0.75rem; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      width: auto; 
      margin: 0; 
      padding: 0.2rem 0.5rem; 
      box-shadow: none;
      font-weight: bold;
      opacity: 0.7;
    }

    .nav-btn.active { 
      color: #ec4899; 
      font-weight: bold; 
      opacity: 1;
      transform: scale(1.08);
    }

    .item-list { list-style: none; margin-top: 0.5rem; }
    
    .item-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 0.6rem 0.8rem; 
      border-bottom: 1px dashed var(--border); 
      background: #faf5ff;
      border-radius: 12px;
      margin-bottom: 0.4rem;
    }

    .badge { 
      background: #fbcfe8; 
      color: #be185d; 
      padding: 0.25rem 0.6rem; 
      border-radius: 20px; 
      font-size: 0.75rem; 
      font-weight: bold;
    }
    
    .stat-box { 
      background: linear-gradient(135deg, #fae8ff, #f3e8ff); 
      border: 1px solid var(--border);
      border-radius: 14px; 
      padding: 0.85rem 1rem; 
      margin-bottom: 0.6rem; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
  </style>
</head>
<body>

  <header>🌸✨ Mi Súper Control Kawaii ✨💖</header>

  <div class="container">
    <!-- 1. REGISTRAR COMPRA -->
    <section id="sec-registrar" class="section active">
      <div class="card">
        <h2>📝🌸 Nueva Orden de Compra</h2>
        <form id="form-compra">
          <label>🛍️ Supermercado</label>
          <input type="text" id="super-nombre" placeholder="Ej: Carrefour, Coto" list="dl-superes" required>
          <datalist id="dl-superes"></datalist>
          
          <label>📅 Fecha</label>
          <input type="date" id="compra-fecha" required>

          <label>🎀 Producto</label>
          <input type="text" id="prod-nombre" placeholder="Ej: leche sachet 3%" list="dl-productos" required>
          <datalist id="dl-productos"></datalist>

          <div class="grid-2">
            <div>
              <label>🔢 Cantidad</label>
              <input type="number" id="prod-cantidad" value="1" min="1" step="1" required>
            </div>
            <div>
              <label>💵 Precio ($)</label>
              <input type="number" step="0.01" id="prod-precio" placeholder="0.00" required>
            </div>
          </div>

          <button type="submit">💖 Guardar Registro 💖</button>
        </form>
      </div>
    </section>

    <!-- 2. OPTIMIZAR COMPRA -->
    <section id="sec-optimizar" class="section">
      <div class="card">
        <h2>🛒✨ Armar Lista Cute</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Seleccioná qué querés comprar para calcular el súper más económico hoy 🌸</p>
        
        <div id="lista-seleccion-productos" style="margin-top: 1rem;"></div>
        <button onclick="calcularMejorOpcion()">🌷 Calcular Mejor Opción 🌷</button>
      </div>

      <div id="resultado-optimizacion" class="card" style="display:none;">
        <h2>💡💖 Resultado Recomendado</h2>
        <div id="detalle-resultado"></div>
      </div>
    </section>

    <!-- 3. PROMOS Y DESCUENTOS -->
    <section id="sec-promos" class="section">
      <div class="card">
        <h2>🏷️✨ Nueva Promoción</h2>
        <form id="form-promo">
          <label>🛍️ Supermercado</label>
          <input type="text" id="promo-super" list="dl-superes" required>

          <label>🗓️ Día de la semana</label>
          <select id="promo-dia">
            <option value="1">🌸 Lunes</option>
            <option value="2">🌸 Martes</option>
            <option value="3">🌸 Miércoles</option>
            <option value="4">🌸 Jueves</option>
            <option value="5">🌸 Viernes</option>
            <option value="6">🌸 Sábado</option>
            <option value="0">🌸 Domingo</option>
          </select>

          <label>💳 Medio de Pago / Banco</label>
          <input type="text" id="promo-pago" placeholder="Ej: Tarjeta VISA Galicia" required>

          <label>🎁 Descuento (%)</label>
          <input type="number" id="promo-desc" placeholder="Ej: 20" required>

          <label>⏳ Vigencia Hasta</label>
          <input type="date" id="promo-hasta" required>

          <button type="submit">💖 Guardar Promo 💖</button>
        </form>
      </div>

      <div class="card">
        <h2>🌸 Promociones Activas 🌸</h2>
        <ul id="lista-promos" class="item-list"></ul>
      </div>
    </section>

    <!-- 4. GASTOS POR MES -->
    <section id="sec-gastos" class="section">
      <div class="card">
        <h2>📊💖 Gastos por Mes</h2>
        <div id="lista-gastos-mes"></div>
      </div>
    </section>

    <!-- 5. CATÁLOGO / BASE DE DATOS -->
    <section id="sec-catalogo" class="section">
      <div class="card">
        <h2>📦✨ Base de Productos</h2>
        <input type="text" id="buscar-producto" placeholder="🔍 Buscar producto cute..." onkeyup="renderCatalogo()">
        <ul id="lista-catalogo" class="item-list"></ul>
      </div>
    </section>
  </div>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav class="nav-bar">
    <button class="nav-btn active" onclick="cambiarSeccion('sec-registrar', this)">📝 Registrar</button>
    <button class="nav-btn" onclick="cambiarSeccion('sec-optimizar', this)">🛒 Comprar</button>
    <button class="nav-btn" onclick="cambiarSeccion('sec-promos', this)">🏷️ Promos</button>
    <button class="nav-btn" onclick="cambiarSeccion('sec-gastos', this)">📊 Gastos</button>
    <button class="nav-btn" onclick="cambiarSeccion('sec-catalogo', this)">📦 Catálogo</button>
  </nav>

  <script>
    // Base de Datos Local
    let db = {
      compras: JSON.parse(localStorage.getItem('db_compras')) || [],
      promos: JSON.parse(localStorage.getItem('db_promos')) || []
    };

    function guardarDB() {
      localStorage.setItem('db_compras', JSON.stringify(db.compras));
      localStorage.setItem('db_promos', JSON.stringify(db.promos));
      actualizarDataLists();
    }

    // Setear fecha de hoy por defecto
    document.getElementById('compra-fecha').value = new Date().toISOString().substring(0, 10);

    function actualizarDataLists() {
      const dlProds = document.getElementById('dl-productos');
      const dlSuperes = document.getElementById('dl-superes');
      
      const productosUnicos = [...new Set(db.compras.map(c => c.producto))];
      const superesUnicos = [...new Set(db.compras.map(c => c.super))];

      dlProds.innerHTML = productosUnicos.map(p => `<option value="${p}">`).join('');
      dlSuperes.innerHTML = superesUnicos.map(s => `<option value="${s}">`).join('');
    }

    actualizarDataLists();

    // Navegación
    function cambiarSeccion(secId, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(secId).classList.add('active');
      btn.classList.add('active');

      if(secId === 'sec-optimizar') cargarSelectorOptimizacion();
      if(secId === 'sec-catalogo') renderCatalogo();
      if(secId === 'sec-promos') renderPromos();
      if(secId === 'sec-gastos') renderGastosPorMes();
    }

    // Guardar Compra
    document.getElementById('form-compra').addEventListener('submit', (e) => {
      e.preventDefault();
      const cant = parseInt(document.getElementById('prod-cantidad').value) || 1;
      const precioUnitario = parseFloat(document.getElementById('prod-precio').value);
      const totalPrecio = precioUnitario * cant;

      const registro = {
        id: Date.now(),
        super: document.getElementById('super-nombre').value.trim().toLowerCase(),
        fecha: document.getElementById('compra-fecha').value,
        producto: document.getElementById('prod-nombre').value.trim().toLowerCase(),
        precio: totalPrecio,
        cantidad: cant
      };
      
      db.compras.push(registro);
      guardarDB();
      alert(`¡Guardado con amor! 🌸 (${cant}x $${precioUnitario.toFixed(2)} = $${totalPrecio.toFixed(2)})`);
      
      // Reset pero mantener súper y fecha para carga rápida
      document.getElementById('prod-nombre').value = '';
      document.getElementById('prod-precio').value = '';
      document.getElementById('prod-cantidad').value = '1';
      document.getElementById('prod-nombre').focus();
    });

    // Guardar Promo
    document.getElementById('form-promo').addEventListener('submit', (e) => {
      e.preventDefault();
      const promo = {
        id: Date.now(),
        super: document.getElementById('promo-super').value.trim().toLowerCase(),
        dia: parseInt(document.getElementById('promo-dia').value),
        pago: document.getElementById('promo-pago').value,
        descuento: parseFloat(document.getElementById('promo-desc').value),
        hasta: document.getElementById('promo-hasta').value
      };
      
      db.promos.push(promo);
      guardarDB();
      renderPromos();
      e.target.reset();
    });

    function renderPromos() {
      const lista = document.getElementById('lista-promos');
      lista.innerHTML = '';
      const hoy = new Date().toISOString().substring(0, 10);
      
      db.promos = db.promos.filter(p => p.hasta >= hoy);
      guardarDB();

      const diasSemana = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

      db.promos.forEach(p => {
        lista.innerHTML += `
          <li class="item-row">
            <div>
              <strong>🌸 ${p.super.toUpperCase()}</strong> (${diasSemana[p.dia]})<br>
              <small>${p.pago} — <strong>${p.descuento}% OFF</strong> 💖 (Hasta ${p.hasta})</small>
            </div>
            <button class="btn-danger" style="width:auto; padding: 0.3rem 0.6rem; border-radius:10px;" onclick="borrarPromo(${p.id})">❌</button>
          </li>
        `;
      });
    }

    function borrarPromo(id) {
      db.promos = db.promos.filter(p => p.id !== id);
      guardarDB();
      renderPromos();
    }

    // Catálogo y Edición
    function renderCatalogo() {
      const lista = document.getElementById('lista-catalogo');
      const busqueda = document.getElementById('buscar-producto').value.toLowerCase();
      lista.innerHTML = '';

      const filtrados = db.compras.filter(c => c.producto.includes(busqueda));

      filtrados.slice().reverse().forEach(c => {
        const cantStr = c.cantidad && c.cantidad > 1 ? `(${c.cantidad}u)` : '';
        const unitarioStr = c.cantidad && c.cantidad > 1 ? `<small style="color:var(--text-muted);"> ($${(c.precio/c.cantidad).toFixed(2)} c/u)</small>` : '';

        lista.innerHTML += `
          <li class="item-row">
            <div>
              <strong>✨ ${c.producto}</strong> ${cantStr} <span class="badge">${c.super}</span><br>
              <small><strong>$${c.precio.toFixed(2)}</strong></small>${unitarioStr} — <small>${c.fecha}</small>
            </div>
            <div style="display:flex; gap:0.3rem;">
              <button class="btn-secondary" style="width:auto; padding:0.3rem 0.5rem; border-radius:10px;" onclick="editarPrecio(${c.id})">✏️</button>
              <button class="btn-danger" style="width:auto; padding:0.3rem 0.5rem; border-radius:10px;" onclick="borrarRegistro(${c.id})">🗑️</button>
            </div>
          </li>
        `;
      });
    }

    function editarPrecio(id) {
      const item = db.compras.find(c => c.id === id);
      const nuevoPrecio = prompt(`Nuevo precio TOTAL pagado por ${item.producto} en ${item.super}:`, item.precio);
      if(nuevoPrecio && !isNaN(nuevoPrecio)) {
        item.precio = parseFloat(nuevoPrecio);
        item.fecha = new Date().toISOString().substring(0, 10);
        guardarDB();
        renderCatalogo();
      }
    }

    function borrarRegistro(id) {
      if(confirm('¿Eliminar este registro de la base de datos?')) {
        db.compras = db.compras.filter(c => c.id !== id);
        guardarDB();
        renderCatalogo();
      }
    }

    // Reporte de Gastos por Mes
    function renderGastosPorMes() {
      const contenedor = document.getElementById('lista-gastos-mes');
      contenedor.innerHTML = '';

      if (db.compras.length === 0) {
        contenedor.innerHTML = '<p style="color:var(--text-muted);">Aún no hay compras registradas 🌸</p>';
        return;
      }

      // Agrupar por YYYY-MM
      let gastosMes = {};

      db.compras.forEach(c => {
        const mesKey = c.fecha ? c.fecha.substring(0, 7) : 'Sin Fecha';
        if (!gastosMes[mesKey]) gastosMes[mesKey] = 0;
        gastosMes[mesKey] += c.precio;
      });

      // Ordenar meses de más reciente a más antiguo
      const mesesOrdenados = Object.keys(gastosMes).sort().reverse();

      const nombresMeses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

      mesesOrdenados.forEach(m => {
        const [anio, mesNum] = m.split('-');
        const nombreMes = mesNum ? `${nombresMeses[parseInt(mesNum) - 1]} ${anio}` : m;

        contenedor.innerHTML += `
          <div class="stat-box">
            <span><strong>🌸 ${nombreMes}</strong></span>
            <span style="font-size: 1.15rem; font-weight: bold; color: var(--primary-dark);">$${gastosMes[m].toFixed(2)}</span>
          </div>
        `;
      });
    }

    // Algoritmo de Optimización de Compras
    function cargarSelectorOptimizacion() {
      const contenedor = document.getElementById('lista-seleccion-productos');
      contenedor.innerHTML = '';
      
      const productosUnicos = [...new Set(db.compras.map(c => c.producto))];

      if(productosUnicos.length === 0) {
        contenedor.innerHTML = '<p style="color:var(--text-muted);">No hay productos registrados aún 🌷</p>';
        return;
      }

      productosUnicos.forEach(prod => {
        contenedor.innerHTML += `
          <label style="display:flex; align-items:center; gap:0.6rem; margin-top:0.5rem; font-weight:normal; color:var(--text);">
            <input type="checkbox" value="${prod}" class="chk-prod" style="width:auto;"> ✨ ${prod}
          </label>
        `;
      });
    }

    function calcularMejorOpcion() {
      const seleccionados = Array.from(document.querySelectorAll('.chk-prod:checked')).map(cb => cb.value);
      if(seleccionados.length === 0) return alert('Seleccioná al menos un producto 🌸');

      const hoy = new Date();
      const diaHoy = hoy.getDay();
      const fechaHoyStr = hoy.toISOString().substring(0, 10);

      const promosHoy = db.promos.filter(p => p.dia === diaHoy && p.hasta >= fechaHoyStr);

      let opciones = {};

      seleccionados.forEach(prod => {
        const registros = db.compras.filter(c => c.producto === prod);
        
        registros.forEach(reg => {
          if(!opciones[reg.super]) opciones[reg.super] = { totalBase: 0, faltantes: 0, items: [] };
        });
      });

      let resultados = [];

      for (let superNombre in opciones) {
        let total = 0;
        let count = 0;

        seleccionados.forEach(prod => {
          // Obtener el precio unitario más reciente
          const reg = db.compras
            .filter(c => c.producto === prod && c.super === superNombre)
            .sort((a,b) => new Date(b.fecha) - new Date(a.fecha))[0];

          if(reg) {
            const precioUnitario = reg.cantidad ? (reg.precio / reg.cantidad) : reg.precio;
            total += precioUnitario;
            count++;
          }
        });

        const promoSuper = promosHoy.find(p => p.super === superNombre);
        let totalConDescuento = total;
        let infoPromo = "Sin promo hoy 🌸";

        if(promoSuper) {
          totalConDescuento = total * (1 - promoSuper.descuento / 100);
          infoPromo = `${promoSuper.descuento}% OFF pagando con ${promoSuper.pago} 💖`;
        }

        resultados.push({
          super: superNombre,
          totalOriginal: total,
          totalFinal: totalConDescuento,
          cubiertos: count,
          promocion: infoPromo
        });
      }

      resultados.sort((a,b) => a.totalFinal - b.totalFinal);

      const divRes = document.getElementById('detalle-resultado');
      divRes.innerHTML = '';

      resultados.forEach((r, idx) => {
        divRes.innerHTML += `
          <div style="border-bottom: 1px dashed #f0abfc; padding: 0.6rem 0;">
            <p style="font-weight:bold; color:${idx===0?'#ec4899':'#581c87'}">
              ${idx === 0 ? '🏆 Mejor Opción: ' : '🌸 '}${r.super.toUpperCase()}
            </p>
            <p style="margin-top:0.2rem;">Estimado (1u c/u): <strong>$${r.totalFinal.toFixed(2)}</strong> <small style="color:var(--text-muted);">(Base: $${r.totalOriginal.toFixed(2)})</small></p>
            <p style="font-size:0.8rem; color:var(--text-muted); margin-top:0.1rem;">Promo: ${r.promocion}</p>
            <p style="font-size:0.8rem; color:var(--text-muted);">Tiene ${r.cubiertos} de ${seleccionados.length} productos seleccionados.</p>
          </div>
        `;
      });

      document.getElementById('resultado-optimizacion').style.display = 'block';
    }
  </script>
</body>
</html>
